deploymentMode: Monolithic
serviceAccount: {create: false, name: default}
rbac: {namespaced: true, sccEnabled: false}
loki:
  auth_enabled: false
  analytics: {reporting_enabled: false}
  image:
    registry: harbor.ocp.example.local
    repository: mirror/docker.io/grafana/loki
    tag: 3.7.9
  commonConfig: {replication_factor: 1}
  storage: {type: filesystem}
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index: {prefix: loki_index_, period: 24h}
  limits_config: {retention_period: 168h}
  compactor: {retention_enabled: true, delete_request_store: filesystem}
  podSecurityContext: {fsGroup: null, runAsGroup: null, runAsUser: null}
singleBinary:
  replicas: 1
  persistence: {enabled: true, size: 10Gi, storageClass: lvms-vg1}
write: {replicas: 0}
read: {replicas: 0}
backend: {replicas: 0}
chunksCache: {enabled: false}
resultsCache: {enabled: false}
lokiCanary: {enabled: false}
gateway: {enabled: false}
test: {enabled: false}
sidecar: {rules: {enabled: false}}
