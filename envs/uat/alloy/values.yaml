# Cách B (lab): 1 Alloy Deployment, lấy log qua API Kubernetes (loki.source.kubernetes).
# VCB (41 node) cần cách A: DaemonSet đọc /var/log/pods + SCC ngoại lệ.
fullnameOverride: alloy
crds:
  create: false
rbac:
  create: false            # ClusterRole nằm ở bootstrap/argocd-alloy-rbac.yaml
serviceAccount:
  create: true
  name: alloy
image:
  registry: harbor.ocp.example.local/mirror/docker.io
  repository: grafana/alloy
  tag: v1.21.3
configReloader:
  image:
    registry: harbor.ocp.example.local/mirror/quay.io
    repository: prometheus-operator/prometheus-config-reloader
    tag: v0.94.2
    digest: ""
  securityContext:
    runAsUser: null
    runAsGroup: null
controller:
  type: deployment
  replicas: 1
  podSecurityContext:
    fsGroup: null
    runAsUser: null
    runAsGroup: null
alloy:
  enableReporting: false
  stabilityLevel: public-preview
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}
  configMap:
    create: true
    content: |
      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          regex         = "openshift-.*|kube-.*|default"
          action        = "drop"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.dih-obs.svc.cluster.local:3100/loki/api/v1/push"
        }
      }
