# Fluent Bit 5.1.3 (chart 0.58.3) - thu log namespace dih-* vào OpenSearch (WBS A.3.8)
image:
  repository: harbor.ocp.example.local/mirror/cr.fluentbit.io/fluent/fluent-bit
  tag: "5.1.3"
  pullPolicy: IfNotPresent
testFramework: { enabled: false }     # mặc định kéo busybox từ docker.io
hotReload: { enabled: false }         # mặc định kéo image phụ ngoài Harbor
rbac: { create: false, nodeAccess: false, eventsAccess: false }   # ClusterRole áp tay: bootstrap/fluent-bit-rbac.yaml
serviceAccount: { create: true, name: fluent-bit }                # SCC gắn tại bootstrap/fluent-bit-scc.yaml
podSecurityContext: { seccompProfile: { type: RuntimeDefault } }
securityContext:
  runAsUser: 0
  allowPrivilegeEscalation: false
  capabilities: { drop: [ALL] }
  seLinuxOptions: { type: spc_t }     # đọc /var/log/pods (container_log_t)
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { memory: 256Mi }
daemonSetVolumes:
  - name: varlog
    hostPath: { path: /var/log }
daemonSetVolumeMounts:
  - name: varlog
    mountPath: /var/log
    readOnly: true
serviceMonitor: { enabled: true }
config:
  inputs: |
    [INPUT]
        Name tail
        Path /var/log/containers/*_dih-*_*.log
        multiline.parser cri
        Tag kube.*
        Mem_Buf_Limit 10MB
        Skip_Long_Lines On
  filters: |
    [FILTER]
        Name kubernetes
        Match kube.*
        Merge_Log On
        Keep_Log Off
        K8S-Logging.Parser On
        K8S-Logging.Exclude On
  outputs: |
    [OUTPUT]
        Name es
        Match kube.*
        Host opensearch-logs.dih-obs.svc.cluster.local
        Port 9200
        Logstash_Format On
        Logstash_Prefix dih-logs
        Suppress_Type_Name On
        Replace_Dots On
        Trace_Error On
        Retry_Limit 10
