imagePullSecrets:
  - name: harbor-pull
global:
  postgresqlSecretName: dagster-postgresql-secret
postgresql:
  enabled: false
  postgresqlHost: dih-pg-rw.dih-data.svc.cluster.local
  postgresqlUsername: dagster
  postgresqlDatabase: dagster
  service:
    port: 5432
dagsterWebserver:
  image:
    repository: harbor.ocp.example.local/mirror/docker.io/dagster/dagster-k8s
    tag: "1.13.28"
  resources:
    requests: { cpu: 200m, memory: 512Mi }
dagsterDaemon:
  image:
    repository: harbor.ocp.example.local/mirror/docker.io/dagster/dagster-k8s
    tag: "1.13.28"
  resources:
    requests: { cpu: 200m, memory: 512Mi }
runLauncher:
  type: K8sRunLauncher
dagster-user-deployments:
  enabled: true
  imagePullSecrets:
    - name: harbor-pull
  deployments:
    - name: dih-pipelines
      image:
        repository: harbor.ocp.example.local/mirror/dih/dagster-pipelines
        tag: uat-006
        pullPolicy: IfNotPresent
      dagsterApiGrpcArgs: ["--package-name", "dih_pipelines"]
      port: 3030
      includeConfigInLaunchedRuns:
        enabled: true
      env:
        - name: OM_TOKEN
          valueFrom:
            secretKeyRef: {name: openmetadata-ingestion-token, key: token}
        - name: PG_METADATA_PASSWORD
          valueFrom:
            secretKeyRef: {name: pg-metadata-reader, key: password}
      resources:
        requests: { cpu: 200m, memory: 512Mi }
