image:
  registry: harbor.ocp.example.local
  repository: mirror/docker.io/grafana/grafana
  tag: 13.3.0-distroless
serviceAccount: {create: false, name: default}
rbac: {create: false}
testFramework: {enabled: false}
initChownData: {enabled: false}
deploymentStrategy: {type: Recreate}
securityContext: {runAsUser: null, runAsGroup: null, fsGroup: null}
persistence: {enabled: true, size: 2Gi, storageClassName: lvms-vg1}
admin: {existingSecret: grafana-admin, userKey: admin-user, passwordKey: admin-password}
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {memory: 512Mi}
# Token đọc metrics của OCP (SA grafana-prom); Secret tạo tay, không nằm trong Git (mục 0.6)
envValueFrom:
  PROM_TOKEN:
    secretKeyRef: {name: grafana-prom-token, key: token}
grafana.ini:
  analytics: {reporting_enabled: false, check_for_updates: false, check_for_plugin_updates: false}
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki.dih-obs.svc.cluster.local:3100
      - name: Prometheus (DIH - Thanos)
        uid: prometheus-dih
        type: prometheus
        access: proxy
        url: http://thanos-query.dih-obs.svc.cluster.local:9090
        jsonData:
          timeInterval: 30s
      - name: Prometheus (OCP)
        uid: prometheus-ocp
        type: prometheus
        access: proxy
        isDefault: true
        url: https://thanos-querier.openshift-monitoring.svc:9091
        jsonData:
          httpHeaderName1: Authorization
          tlsSkipVerify: true      # lab; VCB: nạp service-CA
          timeInterval: 30s
        secureJsonData:
          httpHeaderValue1: "Bearer ${PROM_TOKEN}"
