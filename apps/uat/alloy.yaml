apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dih-uat-alloy
  namespace: openshift-gitops
  annotations: { argocd.argoproj.io/sync-wave: "6" }
spec:
  project: default
  source:
    repoURL: https://github.com/luckylucky2017/dih-gitops.git
    targetRevision: main
    path: charts/alloy
    helm:
      releaseName: alloy
      valueFiles:
      - ../../envs/uat/alloy/values.yaml
  destination: { server: https://kubernetes.default.svc, namespace: dih-obs }
  syncPolicy:
    automated: { prune: false, selfHeal: true }
