apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dih-uat-openmetadata
  namespace: openshift-gitops
  annotations: { argocd.argoproj.io/sync-wave: "6" }
spec:
  project: default
  source:
    repoURL: https://github.com/luckylucky2017/dih-gitops.git
    targetRevision: main
    path: charts/openmetadata
    helm:
      releaseName: openmetadata
      skipTests: true          # bỏ Pod test-connection (ảnh busybox chưa mirror)
      valueFiles:
      - ../../envs/uat/openmetadata/values.yaml
  destination: { server: https://kubernetes.default.svc, namespace: dih-meta }
  syncPolicy:
    automated: { prune: false, selfHeal: true }
