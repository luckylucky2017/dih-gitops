apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dih-uat-meta-routes
  namespace: openshift-gitops
  annotations: { argocd.argoproj.io/sync-wave: "7" }
spec:
  project: default
  source:
    repoURL: https://github.com/luckylucky2017/dih-gitops.git
    targetRevision: main
    path: envs/uat/meta
  destination: { server: https://kubernetes.default.svc, namespace: dih-meta }
  syncPolicy:
    automated: { prune: false, selfHeal: true }
