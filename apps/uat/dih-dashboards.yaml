apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dih-uat-dashboards
  namespace: openshift-gitops
  annotations: { argocd.argoproj.io/sync-wave: "4" }
spec:
  project: default
  source:
    repoURL: https://github.com/luckylucky2017/dih-gitops.git
    targetRevision: main
    path: charts/dih-dashboards
    helm:
      releaseName: dih-dashboards
      valueFiles:
      - ../../envs/uat/dih-dashboards/values.yaml
  destination: { server: https://kubernetes.default.svc, namespace: dih-obs }
  syncPolicy:
    automated: { prune: false, selfHeal: true }
