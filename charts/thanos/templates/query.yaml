apiVersion: apps/v1
kind: Deployment
metadata:
  name: thanos-query
  labels: { app.kubernetes.io/name: thanos-query, app.kubernetes.io/part-of: thanos }
spec:
  replicas: {{ .Values.query.replicas }}
  selector: { matchLabels: { app.kubernetes.io/name: thanos-query } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: thanos-query, app.kubernetes.io/part-of: thanos }
    spec:
      containers:
      - name: query
        image: {{ include "thanos.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args:
        - query
        - --http-address=0.0.0.0:10902
        - --grpc-address=0.0.0.0:10901
        - --endpoint={{ .Values.sidecarEndpoint }}
        - --endpoint=dnssrv+_grpc._tcp.thanos-store.{{ .Release.Namespace }}.svc.cluster.local
        - --query.replica-label=prometheus_replica
        - --query.auto-downsampling
        ports:
        - { name: http, containerPort: 10902 }
        - { name: grpc, containerPort: 10901 }
        readinessProbe: { httpGet: { path: /-/ready, port: http }, periodSeconds: 10 }
        livenessProbe: { httpGet: { path: /-/healthy, port: http }, periodSeconds: 20 }
        resources: {{ toJson .Values.query.resources }}
        securityContext:
          {{- include "thanos.secctx" . | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: thanos-query
  labels: { app.kubernetes.io/name: thanos-query, app.kubernetes.io/part-of: thanos }
spec:
  selector: { app.kubernetes.io/name: thanos-query }
  ports:
  - { name: http, port: 9090, targetPort: http }
  - { name: grpc, port: 10901, targetPort: grpc }
