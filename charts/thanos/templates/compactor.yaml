# Chỉ chạy ĐÚNG 1 Compactor trên mỗi bucket (nhiều bản sẽ làm hỏng dữ liệu).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: thanos-compactor
  labels: { app.kubernetes.io/name: thanos-compactor, app.kubernetes.io/part-of: thanos }
spec:
  replicas: 1
  serviceName: thanos-compactor
  selector: { matchLabels: { app.kubernetes.io/name: thanos-compactor } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: thanos-compactor, app.kubernetes.io/part-of: thanos }
    spec:
      containers:
      - name: compactor
        image: {{ include "thanos.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args:
        - compact
        - --wait
        - --data-dir=/data
        - --objstore.config-file=/etc/thanos/{{ .Values.objstoreSecret.key }}
        - --http-address=0.0.0.0:10902
        - --compact.concurrency=1
        - --retention.resolution-raw={{ .Values.compactor.retentionRaw }}
        - --retention.resolution-5m={{ .Values.compactor.retention5m }}
        - --retention.resolution-1h={{ .Values.compactor.retention1h }}
        ports:
        - { name: http, containerPort: 10902 }
        readinessProbe: { httpGet: { path: /-/ready, port: http }, periodSeconds: 10 }
        livenessProbe: { httpGet: { path: /-/healthy, port: http }, periodSeconds: 20 }
        resources: {{ toJson .Values.compactor.resources }}
        securityContext:
          {{- include "thanos.secctx" . | nindent 10 }}
        volumeMounts:
        - { name: data, mountPath: /data }
        - { name: objstore, mountPath: /etc/thanos, readOnly: true }
      volumes:
      - name: objstore
        secret: { secretName: {{ .Values.objstoreSecret.name }} }
  volumeClaimTemplates:
  - metadata: { name: data }
    spec:
      accessModes: [ReadWriteOnce]
      storageClassName: {{ .Values.storageClass }}
      resources: { requests: { storage: {{ .Values.compactor.storage }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: thanos-compactor
  labels: { app.kubernetes.io/name: thanos-compactor, app.kubernetes.io/part-of: thanos }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: thanos-compactor }
  ports:
  - { name: http, port: 10902, targetPort: http }
