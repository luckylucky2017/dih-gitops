apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: thanos-store
  labels: { app.kubernetes.io/name: thanos-store, app.kubernetes.io/part-of: thanos }
spec:
  replicas: 1
  serviceName: thanos-store
  selector: { matchLabels: { app.kubernetes.io/name: thanos-store } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: thanos-store, app.kubernetes.io/part-of: thanos }
    spec:
      containers:
      - name: store
        image: {{ include "thanos.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args:
        - store
        - --data-dir=/data
        - --objstore.config-file=/etc/thanos/{{ .Values.objstoreSecret.key }}
        - --http-address=0.0.0.0:10902
        - --grpc-address=0.0.0.0:10901
        ports:
        - { name: http, containerPort: 10902 }
        - { name: grpc, containerPort: 10901 }
        readinessProbe: { httpGet: { path: /-/ready, port: http }, periodSeconds: 10 }
        livenessProbe: { httpGet: { path: /-/healthy, port: http }, periodSeconds: 20 }
        resources: {{ toJson .Values.store.resources }}
        securityContext:
          {{- include "thanos.secctx" . | nindent 10 }}
        volumeMounts:
        - { name: data, mountPath: /data }
        - { name: objstore, mountPath: /etc/thanos, readOnly: true }
      volumes:
      - name: objstore
        secret: { secretName: {{ .Values.objstoreSecret.name }} }
  volumeClaimTemplates:
  - metadata: { name: data }
    spec:
      accessModes: [ReadWriteOnce]
      storageClassName: {{ .Values.storageClass }}
      resources: { requests: { storage: {{ .Values.store.storage }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: thanos-store
  labels: { app.kubernetes.io/name: thanos-store, app.kubernetes.io/part-of: thanos }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: thanos-store }
  ports:
  - { name: http, port: 10902, targetPort: http }
  - { name: grpc, port: 10901, targetPort: grpc }
