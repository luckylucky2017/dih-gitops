apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: argocd-spark-operator-cluster }
rules:
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  resourceNames:
  - sparkapplications.sparkoperator.k8s.io
  - scheduledsparkapplications.sparkoperator.k8s.io
  - sparkconnects.sparkoperator.k8s.io
  verbs: ["get", "update", "patch"]
- apiGroups: ["admissionregistration.k8s.io"]
  resources: ["mutatingwebhookconfigurations", "validatingwebhookconfigurations"]
  resourceNames: ["spark-operator-webhook"]
  verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: argocd-spark-operator-cluster }
subjects:
- { kind: ServiceAccount, name: openshift-gitops-argocd-application-controller, namespace: openshift-gitops }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: argocd-spark-operator-cluster }
