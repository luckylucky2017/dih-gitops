# Ngoại lệ SCC (mục 0.8): ảnh OpenSearch chỉ cho UID 1000 vào /usr/share/opensearch (mode 0700),
# nên dùng nonroot-v2 (non-root, bỏ hết capability) thay vì restricted-v2. Áp tay 1 lần.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opensearch-logs-scc-nonroot-v2
  namespace: dih-obs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:nonroot-v2
subjects:
  - kind: ServiceAccount
    name: opensearch-logs
    namespace: dih-obs
